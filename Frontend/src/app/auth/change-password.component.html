<main class="change-password-shell">
  <section class="change-password-panel">
    <p class="eyebrow">PRIMER ACCESO</p>
    <h1>Cambia tu contraseña</h1>
    <p>Debes cambiar la contraseña inicial antes de continuar. La nueva debe tener al menos 6 caracteres.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="currentPassword">Contraseña actual</label>
      <input id="currentPassword" type="password" formControlName="currentPassword" autocomplete="current-password" />
      <label for="newPassword">Nueva contraseña</label>
      <input id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password" />
      <label for="confirmPassword">Confirmar contraseña</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (errorMessage()) { <p class="error-message" role="alert">{{ errorMessage() }}</p> }

      <button type="submit" [disabled]="isLoading()">{{ isLoading() ? 'Actualizando...' : 'Actualizar contraseña' }}</button>
    </form>
  </section>
</main>
